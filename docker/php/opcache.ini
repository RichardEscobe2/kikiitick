; Configuración de OPcache para producción — KikiiTick
; validate_timestamps=0 es la ganancia de rendimiento real: OPcache deja de
; comparar la marca de tiempo de cada archivo .php en cada request. La
; contrapartida es que un cambio de código NUNCA se refleja sin reconstruir
; la imagen (o `docker compose restart app`) — correcto para un despliegue
; inmutable basado en imágenes, incorrecto si algún día se monta el código
; como bind-mount editable en producción.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=64M
