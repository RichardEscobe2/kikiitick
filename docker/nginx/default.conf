# Nginx — reverse proxy / servidor de estáticos para KikiiTick
#
# Arquitectura real de esta app (NO es una SPA estática separada de la API):
# `routes/web.php` define una ruta catch-all (`Route::get('/{any?}', ...)`) que
# devuelve `resources/views/welcome.blade.php`, la cual usa `@vite(...)` para
# inyectar los assets compilados. Es decir: TODO pasa por PHP-FPM (tanto
# `/api/*` como la carga inicial de la SPA en `/`, `/checkout/5`, etc.) excepto
# los archivos verdaderamente estáticos (`/build/*`, favicon, robots.txt), que
# Nginx sirve directo desde disco por rendimiento. Por eso el patrón
# `try_files $uri $uri/ /index.php?$query_string;` es exactamente correcto aquí:
# resuelve un archivo estático si existe, y si no, deja que Laravel decida
# (API real, o el catch-all que sirve el shell de Vue Router).

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # 🛡️🐛 Encontrado por `nginx -t` real durante la validación de esta tarea:
    # `fastcgi_pass app:9000;` (hostname literal) resuelve el DNS de "app" UNA
    # SOLA VEZ, al cargar la configuración — si el contenedor `app` se recrea
    # (redeploy, `docker compose restart app`) y recibe una IP interna nueva,
    # Nginx sigue enviando tráfico a la IP vieja hasta que se recarga/reinicia
    # él mismo. El resolver embebido de Docker (127.0.0.11) + una variable en
    # vez de un hostname literal fuerza resolución EN CADA REQUEST en lugar de
    # una sola vez al arrancar, y de paso evita que `nginx -t` falle cuando se
    # valida la sintaxis fuera de la red de docker-compose (sin `app` resoluble).
    resolver 127.0.0.11 valid=10s;

    # KikiiTick permite subir imagen de evento hasta 4 MB (EventoController:
    # 'imagen' => 'image|mimes:jpeg,png,jpg,webp|max:4096'). El límite por
    # defecto de Nginx (1 MB) rechazaría el archivo con 413 antes de que
    # Laravel llegue a validarlo — se deja margen sobre el límite real de la app.
    client_max_body_size 10m;

    # 🛡️ Cabeceras de seguridad HTTP (OWASP A05) a nivel de borde — defensa en
    # profundidad además del middleware SecureHeaders de Laravel: estas cabeceras
    # cubren también las respuestas que Nginx sirve directo (archivos estáticos,
    # páginas de error 502/504) que nunca pasan por el middleware de PHP.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compresión gzip para JS/CSS/JSON — reduce peso de transferencia del bundle
    # de Vue (~427 KB) y de las respuestas JSON de la API.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # Imágenes de evento subidas por el organizador (EventoController::
    # handleImageUpload() -> Storage::disk('public'), URL generada con
    # asset('storage/'.$path)). Se usa `alias` en vez de depender del symlink
    # público de Laravel porque public/ y storage/app/public viven en volúmenes
    # Docker COMPARTIDOS PERO SEPARADOS entre `app` y `web` (ver docker-compose.yml):
    # un symlink que apunte fuera del volumen de public/ no resolvería de forma
    # fiable dentro del contenedor de `web`, que nunca monta el resto de storage/.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        access_log off;
    }

    # Assets versionados de Vite (hash en el nombre de archivo -> cache agresivo
    # y seguro: un cambio de contenido siempre genera un nombre de archivo nuevo).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 🛡️ Bloquea acceso directo a archivos de punto (.env, .git, etc.) — defensa
    # adicional aunque estos archivos nunca deberían existir dentro del volumen
    # de public/ que Nginx monta.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;

        # 🛡️ Nunca reenviar la ejecución de un .php que no sea el front controller
        # real — evita que una ruta como /storage/eventos/evil.php (si algún día
        # se subiera un archivo con ese nombre) llegue a ejecutarse como PHP.
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        internal;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
